<style>
:root { --bg:#f4f2ec; --card:#fff; --ink:#17211c; --muted:#66706a; --line:#dfdcd2; --brand:#14231d; --accent:#1d6b4f; --danger:#b3261e;
  --sq-light:#ecebd9; --sq-dark:#6d8f72; --sel:rgba(246,201,14,.55); --last:rgba(246,201,14,.38); --radius:10px; }
* { box-sizing:border-box; } html, body { margin:0; }
body { background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-text-size-adjust:100%; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
h1 { font-size:1.5rem; margin:0 0 .25rem; letter-spacing:-.01em; } h2 { font-size:1.05rem; margin:0 0 .75rem; }
.muted { color:var(--muted); } .small { font-size:.85rem; } .right { text-align:right; } .center { text-align:center; } .num { font-variant-numeric:tabular-nums; }
.top { background:var(--brand); color:#fff; padding:.7rem 1rem; display:flex; align-items:center; gap:1rem; position:sticky; top:0; z-index:5; }
.top .logo { font-weight:700; color:#fff; display:flex; align-items:center; gap:.5rem; } .top .logo img { width:26px; height:26px; }
.top nav { margin-left:auto; display:flex; gap:1rem; align-items:center; font-size:.9rem; } .top nav a { color:#d6e4dc; }
.wrap { max-width:1060px; margin:0 auto; padding:1.1rem 1rem 3rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem; margin-bottom:1rem; }
.row { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; } .spread { justify-content:space-between; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; } @media (max-width:560px) { .grid2 { grid-template-columns:1fr; } }
label { display:block; font-size:.82rem; color:var(--muted); margin-bottom:.25rem; }
input, select, textarea { width:100%; font:inherit; padding:.65rem .75rem; border:1px solid #c9c5b8; border-radius:8px; background:#fff; color:var(--ink); }
input[type=checkbox] { width:auto; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.btn { font:inherit; font-weight:600; border:1px solid transparent; border-radius:8px; padding:.62rem 1rem; cursor:pointer; background:var(--accent); color:#fff; display:inline-block; }
.btn:hover { text-decoration:none; } .btn:disabled { opacity:.5; cursor:default; }
.btn.ghost { background:#fff; color:var(--ink); border-color:#c9c5b8; } .btn.danger { background:var(--danger); }
.btn.sm { padding:.3rem .6rem; font-size:.82rem; } .btn.block { width:100%; }
.err { color:var(--danger); font-size:.9rem; min-height:1.3em; margin:.4rem 0 0; }
.login { min-height:100vh; display:grid; place-items:center; padding:1rem; background:linear-gradient(160deg,#14231d 0 46%,var(--bg) 46%); }
.login .card { width:100%; max-width:380px; padding:1.6rem; box-shadow:0 12px 40px rgba(0,0,0,.18); }
.login .brand { text-align:center; margin-bottom:1.2rem; } .login .brand img { width:54px; height:54px; }
.seg { display:grid; grid-template-columns:1fr 1fr; background:#ebe8de; border-radius:8px; padding:3px; margin-bottom:1rem; }
.seg button { font:inherit; border:0; background:none; padding:.45rem; border-radius:6px; cursor:pointer; color:var(--muted); } .seg button.on { background:#fff; color:var(--ink); font-weight:600; }
.pill { display:inline-block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:.15rem .5rem; border-radius:99px; background:#e8e5da; color:#4d564f; }
.pill.live { background:#d9efe3; color:#135a3f; } .pill.done { background:#e6e6e6; color:#555; } .pill.bad { background:#f7dcd9; color:var(--danger); }
.t-card { display:block; color:inherit; } .t-card:hover { text-decoration:none; border-color:var(--accent); }
.meta { display:flex; gap:1.1rem; flex-wrap:wrap; color:var(--muted); font-size:.88rem; margin-top:.35rem; }
.banner { background:#14231d; color:#fff; border-radius:var(--radius); padding:.9rem 1rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.banner .btn { background:#fff; color:#14231d; }
.tabs { display:flex; gap:.25rem; border-bottom:1px solid var(--line); margin-bottom:.8rem; overflow-x:auto; }
.tabs button { font:inherit; background:none; border:0; border-bottom:3px solid transparent; padding:.55rem .8rem; cursor:pointer; color:var(--muted); white-space:nowrap; }
.tabs button.on { color:var(--ink); border-color:var(--accent); font-weight:600; }
.tablewrap { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-size:.92rem; }
th { text-align:left; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; }
th, td { padding:.5rem; border-bottom:1px solid #ece9df; white-space:nowrap; } td.name { white-space:normal; min-width:9rem; }
.title { color:#a14a00; font-weight:700; font-size:.8em; margin-right:.3em; }
tr.dq td { color:#999; text-decoration:line-through; } tr.dq td:last-child { text-decoration:none; } tr.me td { background:#f3f8f5; }
.game { display:grid; grid-template-columns:minmax(0,560px) minmax(260px,1fr); gap:1rem; align-items:start; }
@media (max-width:860px) { .game { grid-template-columns:1fr; } .wrap.g { padding:.5rem .5rem 2rem; } }
.board { position:relative; width:100%; aspect-ratio:1; display:grid; grid-template:repeat(8,1fr)/repeat(8,1fr); border-radius:6px; overflow:hidden; user-select:none; touch-action:none; box-shadow:0 2px 10px rgba(0,0,0,.15); }
.sq { position:relative; } .sq.l { background:var(--sq-light); } .sq.d { background:var(--sq-dark); }
.sq.last::before, .sq.sel::before { content:""; position:absolute; inset:0; background:var(--last); } .sq.sel::before { background:var(--sel); }
.sq.chk { background:radial-gradient(circle,#e2493b 0 35%,transparent 80%),var(--sq-dark); } .sq.l.chk { background:radial-gradient(circle,#e2493b 0 35%,transparent 80%),var(--sq-light); }
.sq.tgt::after { content:""; position:absolute; inset:36%; border-radius:50%; background:rgba(20,35,29,.32); }
.sq.tgt.occ::after { inset:4%; background:none; border:5px solid rgba(20,35,29,.32); }
.sq img { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.sq .co { position:absolute; font-size:.62rem; font-weight:700; opacity:.7; pointer-events:none; } .sq .co.f { right:3px; bottom:1px; } .sq .co.r { left:3px; top:1px; }
.sq.l .co { color:var(--sq-dark); } .sq.d .co { color:var(--sq-light); }
.drag { position:fixed; pointer-events:none; z-index:50; transform:translate(-50%,-50%); }
.promo { position:absolute; inset:0; background:rgba(0,0,0,.45); display:grid; place-items:center; z-index:3; }
.promo div { background:#fff; border-radius:10px; padding:.4rem; display:flex; } .promo img { width:64px; height:64px; cursor:pointer; }
.strip { display:flex; align-items:center; justify-content:space-between; gap:.6rem; padding:.45rem .15rem; }
.strip .who { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.clock { font:700 1.5rem/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace; padding:.35rem .6rem; border-radius:6px; background:#e4e1d6; color:#555; font-variant-numeric:tabular-nums; }
.clock.run { background:var(--brand); color:#fff; } .clock.low { background:var(--danger); color:#fff; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#bbb; margin-right:.35rem; } .dot.ok { background:#2e9e6b; } .dot.bad { background:var(--danger); }
.moves { max-height:250px; overflow-y:auto; display:grid; grid-template-columns:2.4rem 1fr 1fr; font-size:.92rem; font-variant-numeric:tabular-nums; }
.moves span { padding:.16rem .4rem; } .moves .n { color:var(--muted); } .moves .mv { cursor:pointer; border-radius:4px; } .moves .cur { background:#e4efe9; font-weight:600; }
.result { background:#14231d; color:#fff; border-radius:8px; padding:.8rem 1rem; margin-bottom:.8rem; }
.proctor video { width:112px; height:84px; object-fit:cover; border-radius:6px; background:#111; transform:scaleX(-1); }
.gate { position:absolute; inset:0; background:rgba(20,35,29,.9); color:#fff; z-index:4; display:grid; place-items:center; padding:1.2rem; text-align:center; }
.gate .btn { background:#fff; color:#14231d; } .gate ul { text-align:left; font-size:.88rem; margin:.6rem auto; max-width:22rem; padding-left:1.1rem; }
#modal { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:grid; place-items:center; padding:1rem; }
#modal[hidden], #toast[hidden] { display:none; }
#modal .box { background:#fff; border-radius:12px; padding:1.4rem; max-width:460px; width:100%; } #modal .box.red { border-top:6px solid var(--danger); }
#toast { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:#14231d; color:#fff; padding:.6rem 1rem; border-radius:8px; z-index:110; max-width:90vw; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:.75rem; }
.stat { background:#f6f4ee; border-radius:8px; padding:.7rem .8rem; } .stat b { display:block; font-size:1.4rem; font-variant-numeric:tabular-nums; }
.snaps { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:.5rem; }
.snaps figure { margin:0; font-size:.72rem; color:var(--muted); } .snaps img { width:100%; border-radius:6px; display:block; background:#111; aspect-ratio:4/3; object-fit:cover; }
.snaps figure.flag img { outline:3px solid var(--danger); }
.btn.light { background:#fff; color:var(--brand); } .btn.outline { background:transparent; color:#fff; border-color:#6f877c; }
.hero { background:var(--brand); color:#fff; padding:2.6rem 1rem 3rem; } .hero-in { max-width:1060px; margin:0 auto; }
.hero .kicker { color:#9fc3b2; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
.hero h1 { font-size:clamp(2rem,6vw,3.4rem); line-height:1.05; margin:.5rem 0 .7rem; letter-spacing:-.02em; text-wrap:balance; max-width:16ch; }
.hero p { color:#c9d8d0; max-width:38rem; margin:0 0 1.2rem; } .hero-next { margin-top:1.2rem; padding-top:1rem; border-top:1px solid #2c4238; color:#c9d8d0; font-size:.92rem; }
.feed { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:1.2rem; align-items:start; } @media (max-width:860px) { .feed { grid-template-columns:1fr; } }
h2.sec { font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 .6rem; }
.tcard h3 { margin:0; font-size:1.15rem; } .tcard .desc { color:#3d4741; margin:.6rem 0; white-space:pre-line; }
.money { display:flex; gap:1.6rem; flex-wrap:wrap; margin:.7rem 0; padding:.6rem .8rem; background:#f3f8f5; border-radius:8px; border-left:4px solid var(--accent); }
.money small { display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); } .money b { font-size:1.1rem; }
.news { padding:.7rem 0; border-top:1px solid #ece9df; } .news:first-child { border-top:0; padding-top:0; } .news .date { font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.news h3 { margin:.1rem 0 .2rem; font-size:1rem; } .news p { margin:0; font-size:.9rem; color:#3d4741; white-space:pre-line; }
ol.how { margin:0; padding-left:1.2rem; font-size:.9rem; } ol.how li { margin-bottom:.35rem; }
.pill.open { background:#fff1cc; color:#7a5200; }
.nextg { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:.6rem 0; border-top:1px solid #ece9df; } .nextg:first-of-type { border-top:0; padding-top:0; }
.nextline { margin:.7rem 0; font-weight:600; } .o-win { color:#135a3f; } .o-loss { color:var(--danger); } .o-draw, .o-bye { color:#4d564f; }
.ctl { display:flex; gap:1.2rem; flex-wrap:wrap; align-items:center; margin-top:.9rem; padding-top:.8rem; border-top:1px solid #ece9df; }
.tabs.desk { margin-bottom:1rem; } .rep { padding:.9rem 0; border-top:1px solid #ece9df; } .rep:first-of-type { border-top:0; padding-top:0; }
details { margin-top:.4rem; } summary { cursor:pointer; font-weight:600; font-size:.9rem; padding:.3rem 0; }
#modal .box.wide { max-width:640px; max-height:92vh; overflow:auto; }
.score { font:700 1.6rem/1 system-ui; padding:.5rem .7rem; border-radius:8px; background:#f7dcd9; color:var(--danger); }
</style>
</head>

// ---------------- helpers ----------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = ms => ms ? new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'To be announced';
const fmtTime = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const tc = t => `${Math.round(t.base_sec / 60)}+${t.inc_sec}`;
const pname = (n, title) => (title ? `<span class="title">${esc(title)}</span>` : '') + esc(n || 'Player');
const half = r => String(r ?? '').replace('1/2-1/2', '½-½');

async function rpc(fn, args = {}, auth = true) {
  let r;
  try {
    r = await fetch(`${CONFIG.SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, { method: 'POST',
      headers: { apikey: CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + CONFIG.SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(auth ? { p_token: S.token, ...args } : args) });
  } catch { throw new Error('No connection. Check your internet and try again.'); }
  const j = await r.json().catch(() => null);
  if (!r.ok) {
    const msg = (j && j.message) || 'Something went wrong.';
    if (/log in again/i.test(msg) && S.token) { logout(true); }
    throw new Error(msg);
  }
  if (j && typeof j === 'object' && !Array.isArray(j) && j.error) throw new Error(j.error);

// ---------------- Swiss pairing (runs in the arbiter's browser) ----------------
function pairRound(players) {
  const sorted = [...players].sort((a, b) => b.score - a.score || b.rating - a.rating || a.id - b.id);
  let bye = null;
  if (sorted.length % 2) { let i = sorted.length - 1; while (i >= 0 && sorted[i].hadBye) i--; if (i < 0) i = sorted.length - 1; bye = sorted.splice(i, 1)[0]; }
  const n = sorted.length, used = new Uint8Array(n), partner = new Int32Array(n).fill(-1);
  let budget = 300000;
  const cands = i => { const s = sorted[i].score, grp = [], rest = [];
    for (let j = i + 1; j < n; j++) if (!used[j]) (sorted[j].score === s ? grp : rest).push(j);
    const k = Math.max(0, Math.floor((grp.length + 1) / 2) - 1); return grp.slice(k).concat(grp.slice(0, k).reverse(), rest); };
  function solve(from, rematch) {
    let i = from; while (i < n && used[i]) i++; if (i >= n) return true;
    used[i] = 1;
    for (const c of cands(i)) { if (!rematch && sorted[i].opponents.has(sorted[c].id)) continue;
      used[c] = 1; partner[i] = c; if (solve(i + 1, rematch)) return true; used[c] = 0; partner[i] = -1; if (--budget < 0) break; }
    used[i] = 0; return false;
  }
  if (!solve(0, false)) { used.fill(0); partner.fill(-1); budget = Infinity; solve(0, true); }
  const bal = p => p.colors.reduce((s, c) => s + (c === 'w' ? 1 : -1), 0), pairs = [];
  for (let i = 0; i < n; i++) { if (partner[i] < 0) continue;
    const a = sorted[i], b = sorted[partner[i]], ba = bal(a), bb = bal(b); let aw;
    if (ba !== bb) aw = ba < bb; else { const la = a.colors.at(-1), lb = b.colors.at(-1); aw = la !== lb ? la === 'b' : pairs.length % 2 === 0; }
    pairs.push(aw ? { white: a.id, black: b.id } : { white: b.id, black: a.id }); }
  return { pairs, bye: bye ? bye.id : null };
}

  }

  }
  up(e) { if (!this.dragEl) return; const dragged = !this.dragEl.hidden, from = this.dragFrom; this.endDrag(); if (!dragged) return;
    const sq = this.sqAt(e); if (sq && this.targets.includes(sq)) this.tryMove(from, sq); else this.render(); }
  endDrag() { if (this.dragEl) { this.dragEl.remove(); this.dragEl = null; } }

    const p = this.chess.get(from);

      const d = document.createElement('div'); d.className = 'promo';
      d.innerHTML = '<div>' + ['q', 'r', 'b', 'n'].map(t => `<img data-p="${t}" src="${PIECE[p.color + t]}" alt="${t}">`).join('') + '</div>';
      d.addEventListener('pointerdown', ev => { ev.stopPropagation(); const t = ev.target.dataset.p; d.remove(); if (t) this.onMove({ from, to, promotion: t }); else { this.sel = null; this.targets = []; this.render(); } });
      this.el.appendChild(d);

        if (r1 >= 0.75) reasons.push(`Played the engine's first choice on ${Math.round(r1 * 100)}% of ${counted} non-forced moves`);
        if (acpl <= 10) reasons.push(`Average centipawn loss ${acpl.toFixed(1)}`);

    if (away) reasons.push(`Left the game window ${away} time${away > 1 ? 's' : ''}`);

    if (n('no_face')) reasons.push(`No face visible on camera (${n('no_face')}x)`);
    if (n('voice_detected')) reasons.push(`Talking detected (${n('voice_detected')}x)`);

}

const statusPill = t => t.status === 'running' ? `<span class="pill live">Live · round ${t.current_round}/${t.rounds}</span>` : t.status === 'finished' ? '<span class="pill done">Finished</span>' : '<span class="pill open">Entries open</span>';
const safeUrl = u => (/^https:\/\//i.test(u || '') ? u : '');
const day = ms => new Date(ms).toLocaleDateString([], { day: 'numeric', month: 'short' });
const outcome = g => g.status !== 'finished' ? '' : g.bye ? 'Bye' : g.result === '1/2-1/2' ? 'Draw' : (g.result === '1-0') === g.is_white ? 'Win' : 'Loss';
const until = ms => { const s = Math.max(0, Math.floor((ms - Date.now()) / 1000)), d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}:${String(s % 60).padStart(2, '0')}`; };
function tickCountdowns() { document.querySelectorAll('[data-until]').forEach(e => { e.textContent = until(+e.dataset.until); }); }
setInterval(tickCountdowns, 1000);

    <div class="row">${logged ? `<a class="btn sm" href="#/t/${t.id}">${t.my_status === 'active' ? 'Open my tournament' : 'View'}</a>` : ''}

      ${t.my_status === 'active' ? `<span class="pill live">You are in${t.my_points != null ? ' · ' + t.my_points + ' pts' : ''}</span>` : ''}${t.my_status === 'disqualified' ? '<span class="pill bad">Disqualified</span>' : ''}</div></article>`;
}
const newsHtml = news => news.length ? news.map(n => `<article class="news"><div class="date">${day(n.at)}</div><h3>${esc(n.title)}</h3>${n.body ? `<p>${esc(n.body)}</p>` : ''}</article>`).join('') : '<p class="muted small">No news yet.</p>';

      <div class="card"><h2>How it works</h2><ol class="how"><li>Fill in the entry form and pay the entry fee.</li><li>The organiser activates your mobile number.</li><li>Log in here, set your PIN and join the tournament.</li><li>Play your rounds from home, on camera. Pairings and clocks are automatic.</li></ol></div></aside></div>`; };

function buildPgn(ex) {
  const clk = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const tag = (k, v) => `[${k} "${String(v ?? '?').replace(/"/g, "'")}"]`;
  return ex.games.filter(g => g.black && g.status === 'finished').map(g => [tag('Event', ex.tournament.name), tag('Site', CONFIG.APP_NAME + ' (online)'),
    tag('Date', new Date(g.starts_at).toISOString().slice(0, 10).replace(/-/g, '.')), tag('Round', g.round), tag('Board', g.board), tag('White', g.white), tag('Black', g.black),
    tag('Result', g.result), tag('WhiteElo', g.white_rating || '?'), tag('BlackElo', g.black_rating || '?'), tag('TimeControl', `${ex.tournament.base_sec}+${ex.tournament.inc_sec}`), tag('Termination', g.termination)].join('\n') +
    '\n\n' + g.moves.map((m, i) => `${i % 2 ? '' : i / 2 + 1 + '. '}${m.san} {[%clk ${clk(m.clk)}]}`).join(' ') + (g.moves.length ? ' ' : '') + g.result + '\n').join('\n');
}
function buildCsv(ex) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, iso = ms => ms ? new Date(ms).toISOString() : '';
  let out = 'SECTION,Games\nRound,Board,White,White rating,Black,Black rating,Result,Winner,Loser,Termination,Moves,Started (UTC),Ended (UTC)\n';
  for (const g of ex.games) { const win = g.result === '1-0' ? g.white : g.result === '0-1' ? g.black : '', lose = g.result === '1-0' ? g.black : g.result === '0-1' ? g.white : '';
    out += [g.round, g.board, q(g.white), g.white_rating, q(g.black || 'BYE'), g.black_rating ?? '', g.result || 'in progress', q(win), q(lose || ''), q(g.termination), Math.ceil(g.moves.length / 2), iso(g.starts_at), iso(g.ended_at)].join(',') + '\n'; }
  out += '\nSECTION,Final standings\nRank,Name,Title,Rating,Country,Points,Buchholz,Wins,Games,Status\n';
  for (const s of ex.standings) out += [s.rank, q(s.name), q(s.title), s.rating, q(s.country), s.points, s.buchholz, s.wins, s.played, s.status].join(',') + '\n';
  return out;
}

async function viewTournament(id) {
  let tab = 'standings', round = 0, filter = '', timer, autoTimer = null, busy = false, editing = false;
  const autoKey = 'ca_auto_' + id, here = () => location.hash.startsWith('#/t/' + id);
  const chan = joinChannel('t' + id, () => load().catch(() => {}));
  app.innerHTML = shell('<p class="muted">Loading…</p>');
  async function startRound() {
    const d = await rpc('ca_round_data', { p_id: id });
    if (d.liveGames) throw new Error('Games are still in progress.');
    if (d.players.length < 2) throw new Error('At least 2 active players are needed.');
    const { pairs, bye } = pairRound(d.players.map(p => ({ ...p, opponents: new Set(p.opponents) })));
    await rpc('ca_start_round', { p_id: id, p_pairs: pairs, p_bye: bye, p_delay_sec: CONFIG.START_DELAY_SEC });
    rpc('ca_set_next_round', { p_id: id, p_minutes: null }).catch(() => {});
    chan.send({ k: 'round' });
  }
  async function load() {
    const d = await rpc('ca_tournament', { p_id: id }), t = d.tournament, arb = S.user.role === 'arbiter', now = Date.now();
    if (!round || round > t.current_round) round = t.current_round;
    const games = arb && tab === 'pairings' && t.current_round ? await rpc('ca_pairings', { p_id: id, p_round: round }) : [];
    if (!here() || editing) return;
    const auto = arb && localStorage.getItem(autoKey) === '1';
    // "Run rounds automatically": while the arbiter keeps this page open, the next round starts after the break.
    if (auto && t.status === 'running' && !t.liveGames && !autoTimer && !busy) {
      if (t.current_round < t.rounds) rpc('ca_set_next_round', { p_id: id, p_minutes: CONFIG.BREAK_SEC / 60 }).catch(() => {});
      autoTimer = setTimeout(async () => { autoTimer = null; busy = true;
        try { if (t.current_round >= t.rounds) await rpc('ca_finish_tournament', { p_id: id }); else await startRound(); } catch (e) { toast(e.message); }
        busy = false; load().catch(() => {}); }, CONFIG.BREAK_SEC * 1000);
    }
    const url = safeUrl(t.entry_url) || safeUrl(CONFIG.ENTRY_FORM_URL), me = d.standings.find(p => p.id === S.user.id);
    const nextLine = t.status === 'open' ? (t.starts_at && t.starts_at > now ? `Round 1 starts in <b data-until="${t.starts_at}"></b>` : 'Round 1 starts when the arbiter opens the tournament.')
      : t.status === 'finished' ? 'This tournament is finished.'
      : d.myGameId ? 'Your game is in progress.'
      : t.current_round >= t.rounds ? 'All rounds are played.'
      : t.next_round_at && t.next_round_at > now ? `Round ${t.current_round + 1} starts in <b data-until="${t.next_round_at}"></b>`
      : t.liveGames ? `Round ${t.current_round} is still in play on other boards.` : `Round ${t.current_round + 1} starts when the arbiter opens it.`;
    const head = `<div class="card"><div class="row spread"><h1>${esc(t.name)}</h1>${statusPill(t)}</div>${t.description ? `<p style="white-space:pre-line">${esc(t.description)}</p>` : ''}
      <div class="meta"><span>Swiss · ${t.rounds} rounds</span><span>Time control ${tc(t)}</span><span>${t.players} entered</span><span>Starts: ${fmtDate(t.starts_at)}</span>
        <span>${t.proctoring ? 'Camera and microphone required' : 'No proctoring'}</span>${arb && t.status === 'running' ? `<span>${t.liveGames} game${t.liveGames === 1 ? '' : 's'} in play</span>` : ''}</div>
      ${t.prize || t.entry_fee ? `<div class="money">${t.prize ? `<div><small>Prizes</small><b>${esc(t.prize)}</b></div>` : ''}${t.entry_fee ? `<div><small>Entry fee</small><b>${esc(t.entry_fee)}</b></div>` : ''}</div>` : ''}

          <div class="tablewrap"><table><thead><tr><th>Bd</th><th>White</th><th class="center">Result</th><th>Black</th><th>Monitoring</th><th></th></tr></thead><tbody>

            <td class="center num"><b>${g.black_id === null ? 'bye' : g.status === 'active' ? '<span class="pill live">live</span>' : esc(half(g.result))}</b>${g.disputed ? ' <span class="pill bad">disputed</span>' : ''}</td>
            <td class="name">${g.black_id === null ? '<span class="muted">—</span>' : pname(g.black, g.black_title) + ` <span class="muted small">${g.black_rating || ''}</span>`}</td>
            <td>${g.black_id === null ? '' : (g.flags ? `<span class="pill bad">${g.flags} incident${g.flags === 1 ? '' : 's'}</span>` : '<span class="muted small">clean</span>') + (g.status === 'finished' ? (g.analysed ? ' <span class="muted small">· engine checked</span>' : ' <span class="muted small">· engine check pending</span>') : '')}</td>
            <td class="right">${g.black_id !== null ? `<a href="#/g/${g.id}">${g.status === 'active' ? 'Watch + report' : 'Game + report'}</a>` : ''}</td></tr>`).join('')}
          </tbody></table></div>${!t.current_round ? '<p class="muted">Pairings appear when the tournament starts.</p>' : ''}`;
      }
      body = `<div class="card"><div class="tabs"><button data-tab="standings" class="${tab === 'standings' ? 'on' : ''}">Standings</button><button data-tab="pairings" class="${tab === 'pairings' ? 'on' : ''}">Pairings, results and reports</button></div>
        <input id="flt" placeholder="Search player" value="${esc(filter)}" style="max-width:260px;margin-bottom:.7rem">${tbl}
        <p class="muted small" style="margin:.7rem 0 0">Only arbiters see this table. Players see their own games and score.</p></div>`;
    }
    const active = document.activeElement?.id === 'flt';
    app.innerHTML = shell(head + body); tickCountdowns();
    const fl = document.getElementById('flt');
    if (fl) { if (active) { fl.focus(); fl.setSelectionRange(filter.length, filter.length); } fl.oninput = () => { filter = fl.value; clearTimeout(fl.t); fl.t = setTimeout(() => load().catch(() => {}), 300); }; }
    const rs = document.getElementById('rsel'); if (rs) rs.onchange = () => { round = +rs.value; load(); };
    const au = document.getElementById('auto'); if (au) au.onchange = () => { localStorage.setItem(autoKey, au.checked ? '1' : '0'); if (!au.checked) { clearTimeout(autoTimer); autoTimer = null; } load(); };
    app.querySelectorAll('[data-tab]').forEach(b => (b.onclick = () => { tab = b.dataset.tab; load(); }));
    app.querySelectorAll('main [data-act]').forEach(b => (b.onclick = () => { b.disabled = true; act(b.dataset.act, b.dataset, t).catch(e => toast(e.message)).finally(() => (b.disabled = false)); }));
  }
  async function act(a, ds, t) {
    if (a === 'csv' || a === 'pgn') { const ex = await rpc('ca_export', { p_id: id });
      return a === 'csv' ? saveFile(`tournament-${id}-results.csv`, buildCsv(ex), 'text/csv') : saveFile(`tournament-${id}.pgn`, buildPgn(ex), 'application/x-chess-pgn'); }
    if (a === 'edit') { editing = true; const r = await tournamentForm(t); editing = false; if (r) { await rpc('ca_update_tournament', { p_id: id, p_data: r }); toast('Saved'); } return load(); }
    if (a === 'announce') { const m = Math.max(1, +document.getElementById('nrm').value || 5); await rpc('ca_set_next_round', { p_id: id, p_minutes: m }); toast(`Players now see: next round in ${m} min`); }
    else if (a === 'delete') { if (!(await confirmBox('Delete this tournament?', 'It has not started. Entries to it are removed.', 'Delete', true))) return; await rpc('ca_delete_tournament', { p_id: id }); location.hash = '#/arbiter'; return; }
    else if (a === 'dq') {
      const msg = await modal(`<h2>Disqualify ${esc(ds.name)}?</h2><p class="muted small">Their current game is forfeited, they are removed from future rounds, and they see this message:</p>
        <textarea rows="4">You have been disqualified from "${esc(t.name)}" for a breach of the fair play rules. You may appeal to the chief arbiter.</textarea>
        <div class="row" style="justify-content:flex-end;margin-top:.8rem"><button class="btn ghost" data-close>Cancel</button><button class="btn danger" data-close="ok">Disqualify</button></div>`, true);
      if (msg === null) return; await rpc('ca_disqualify', { p_tid: id, p_user: +ds.uid, p_message: msg });
    } else if (a === 'start') { busy = true; try { await startRound(); } finally { busy = false; } }
    else if (a === 'finish') { if (!(await confirmBox('End the tournament now?', 'No further rounds will be paired.', 'End tournament', true))) return; await rpc('ca_finish_tournament', { p_id: id }); }
    else if (a === 'withdraw') { if (!(await confirmBox('Withdraw from this tournament?', 'A game in progress will be lost.', 'Withdraw', true))) return; await rpc('ca_withdraw', { p_id: id }); }
    else if (a === 'register') await rpc('ca_register', { p_id: id });
    chan.send({ k: 'update' }); await load();
  }
  S.cleanup = () => { clearInterval(timer); clearTimeout(autoTimer); chan.leave(); };
  await load();
  timer = setInterval(() => { if (document.getElementById('modal').hidden && document.activeElement?.id !== 'flt' && document.activeElement?.id !== 'nrm') load().catch(() => {}); }, 8000);
}

// Create / edit form for a tournament, shown in a dialog. Resolves to the data object or null.
function tournamentForm(t) {
  const m = document.getElementById('modal'), v = k => esc(t?.[k] ?? ''), run = t && t.status !== 'open';
  const local = ms => { if (!ms) return ''; const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000); return d.toISOString().slice(0, 16); };
  m.innerHTML = `<div class="box wide"><h2>${t ? 'Edit tournament' : 'New tournament'}</h2><form id="tf">
    <div style="margin-bottom:.6rem"><label>Name</label><input name="name" required maxlength="100" value="${v('name')}" placeholder="e.g. Winter Online Open 2026"></div>
    <div style="margin-bottom:.6rem"><label>Description (shown on the front page)</label><textarea name="description" rows="3" maxlength="2000">${v('description')}</textarea></div>
    <div class="grid2">
      <div><label>Prizes (e.g. ₹10,000 prize fund)</label><input name="prize" maxlength="200" value="${v('prize')}"></div>
      <div><label>Entry fee (e.g. ₹200)</label><input name="entryFee" maxlength="60" value="${v('entry_fee')}"></div>
      <div><label>Entry form link (https://…)</label><input name="entryUrl" type="url" maxlength="300" value="${v('entry_url')}" placeholder="Your Google Form link"></div>
      <div><label>Start time (your local time)</label><input name="startsAt" type="datetime-local" value="${local(t?.starts_at)}"></div>
      <div><label>Rounds (Swiss)</label><input name="rounds" type="number" min="1" max="30" value="${t ? t.rounds : 9}"></div>
      <div><label>Proctoring</label><select name="proctoring" ${run ? 'disabled' : ''}><option value="1" ${!t || t.proctoring ? 'selected' : ''}>Camera and microphone required</option><option value="" ${t && !t.proctoring ? 'selected' : ''}>Off</option></select></div>
      <div><label>Minutes per player</label><input name="baseMin" type="number" min="1" max="180" value="${t ? Math.round(t.base_sec / 60) : 10}" ${run ? 'disabled' : ''}></div>
      <div><label>Increment per move (seconds)</label><input name="incSec" type="number" min="0" max="60" value="${t ? t.inc_sec : 5}" ${run ? 'disabled' : ''}></div>
    </div>${run ? '<p class="muted small">Time control and proctoring cannot change after the start.</p>' : ''}<p class="err" id="tfe"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="tfc">Cancel</button><button class="btn">${t ? 'Save' : 'Create tournament'}</button></div></form></div>`;
  m.hidden = false; m.onclick = null;
  return new Promise(res => {
    document.getElementById('tfc').onclick = () => { m.hidden = true; res(null); };
    document.getElementById('tf').onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      if (f.entryUrl && !/^https:\/\//i.test(f.entryUrl)) { document.getElementById('tfe').textContent = 'The entry form link must start with https://'; return; }
      f.proctoring = run ? undefined : !!f.proctoring; f.startsAt = f.startsAt ? new Date(f.startsAt).toISOString() : ''; m.hidden = true; res(f); };
  });
}

// ---------------- game ----------------
async function viewGame(id) {
  let repHtml = '<p class="muted small">Loading the report…</p>', repAt = 0;
  let g, chess, board, proctor = null, tick, poll, view = null, offset = 0, clockAt = 0, pstat = null, sending = false, lastFlagTry = 0, disputed = false, gone = false;
  const me = S.user.id, myColor = () => (g.white.id === me ? 'w' : g.black.id === me ? 'b' : null), live = () => g.status === 'active';
  const fmtClock = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), m = Math.floor(s / 60);
    return ms < 20000 ? `${m}:${String(s % 60).padStart(2, '0')}.${Math.floor((ms % 1000) / 100)}` : `${m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m}:${String(s % 60).padStart(2, '0')}`; };
  const remaining = c => { if (!live() || g.turn !== c) return g.clock[c]; return g.clock[c] - Math.max(0, Date.now() - Math.max(clockAt, g.startsAt - offset)); };
  const chan = joinChannel('g' + id, () => refresh());

  // Replays the stored moves with the rules engine. A move or result this device cannot verify is reported to the arbiter.
  function verify(ng) {
    const c = new Chess(); let ok = true;
    for (const m of ng.moves) { try { c.move(m.san); } catch { ok = false; break; } }
    if (ok && ng.moves.length && c.fen().split(' ').slice(0, 4).join(' ') !== ng.fen.split(' ').slice(0, 4).join(' ')) ok = false;
    if (ok && ng.status === 'finished') { const t = ng.termination;
      if ((t === 'checkmate' && !c.isCheckmate()) || (t === 'stalemate' && !c.isStalemate()) || (t === 'insufficient material' && !c.isInsufficientMaterial()) ||
          (t === 'threefold repetition' && !c.isThreefoldRepetition()) || (t === 'fifty-move rule' && !c.isDraw())) ok = false; }
    return { ok, chess: ok ? c : new Chess(ng.fen && ng.fen.split(' ').length === 6 ? ng.fen : START_FEN) };
  }
  function setGame(ng) {
    const changed = !g || ng.ply !== g.ply || ng.status !== g.status || ng.drawOffer !== g.drawOffer || ng.ready.w !== g.ready.w || ng.ready.b !== g.ready.b;
    const wasLive = g && live();
    g = ng; offset = g.serverNow - Date.now(); clockAt = Date.now();
    const v = verify(g); chess = v.chess;
    if (!v.ok && !g.disputed && !disputed && myColor()) { disputed = true; toast('A move in this game could not be verified. The arbiter has been notified.'); rpc('ca_action', { p_game: id, p_action: 'dispute' }).catch(() => {}); }
    if (wasLive && !live() && proctor) { proctor.stop(); proctor = null; }
    return changed;
  }
  async function refresh() { if (gone || sending) return; try { const ng = await rpc('ca_game', { p_id: id }); if (!gone && !sending && setGame(ng)) render(); } catch {} }

  function strip(c) { const p = c === 'w' ? g.white : g.black;
    return `<div class="strip"><div class="who">${live() && g.proctoring ? `<span class="dot ${g.ready[c] ? 'ok' : 'bad'}" title="Camera and microphone"></span>` : ''}${pname(p.name, p.title)} <span class="muted small">${p.rating || ''} ${esc(p.country || '')}</span></div><div class="clock" data-clock="${c}"></div></div>`; }
  function render() {
    const mc = myColor(), ori = mc || 'w', top = ori === 'w' ? 'b' : 'w', arb = S.user.role === 'arbiter';
    const res = g.result ? ({ '1-0': 'White wins', '0-1': 'Black wins', '1/2-1/2': 'Draw' }[g.result]) : '';
    let ml = ''; for (let i = 0; i < g.moves.length; i += 2) ml += `<span class="n">${i / 2 + 1}.</span><span class="mv" data-ply="${i + 1}">${esc(g.moves[i].san)}</span><span class="mv" data-ply="${i + 2}">${esc(g.moves[i + 1]?.san || '')}</span>`;
    const camWas = document.getElementById('cam');
    app.innerHTML = shell(`<div class="game"><div>${strip(top)}<div style="position:relative"><div class="board" id="bd"></div><div id="gate"></div></div>${strip(ori)}</div>
      <div><div class="card">
        <div class="row spread small" style="margin-bottom:.5rem"><span class="muted"><a href="#/t/${g.tournamentId}">${esc(g.tournament)}</a> · Round ${g.round} · Board ${g.board}</span><button class="btn ghost sm" data-act="fs">Full screen</button></div>
        ${g.result ? `<div class="result"><b>${half(g.result)} · ${res}</b><div class="small">by ${esc(g.termination)}</div></div>` : `<div id="status" class="small" style="margin-bottom:.5rem"></div>`}
        ${g.disputed ? '<p class="small" style="color:var(--danger)"><b>This game is under review by the arbiter.</b></p>' : ''}
        <div class="moves" id="ml">${ml}</div>
        ${!live() ? `<div class="row" style="margin-top:.7rem"><button class="btn ghost sm" data-nav="0">⏮</button><button class="btn ghost sm" data-nav="-1">◀</button><button class="btn ghost sm" data-nav="1">▶</button><button class="btn ghost sm" data-nav="end">⏭</button></div>` : ''}
        ${live() && mc ? `<div class="row" style="margin-top:.8rem" id="acts"></div>` : ''}
        ${arb && !live() ? `<div class="row small" style="margin-top:.8rem"><span class="muted">Arbiter: set result</span>${['1-0', '1/2-1/2', '0-1'].map(r => `<button class="btn ghost sm" data-res="${r}">${half(r)}</button>`).join('')}</div>` : ''}
      </div>
      ${live() && mc && g.proctoring ? `<div class="card proctor"><h2>Fair play monitoring</h2><div class="row"><video id="cam" playsinline muted></video><div class="small" id="pstat"></div></div>
        <p class="muted small" style="margin:.6rem 0 0">Stay on this page with your camera and microphone on. Leaving the tab, other people in view, and talking are reported to the arbiter.</p></div>` : ''}
      </div></div>
      ${arb ? `<div class="card" style="margin-top:1rem"><div class="row spread" style="margin-bottom:.6rem"><h2 style="margin:0">Fair play report</h2><div class="row" style="gap:.4rem">
        ${!live() ? '<button class="btn sm ghost" id="repchk">Run engine check on this game</button>' : ''}<button class="btn sm ghost" id="reprf">Refresh</button></div></div><div id="rep">${repHtml}</div></div>` : ''}`, 'g');
    fsLabel();
    board = new Board(document.getElementById('bd'), onMove);
    const cam = document.getElementById('cam'); if (proctor && cam) { cam.srcObject = proctor.stream; cam.muted = true; cam.play().catch(() => {}); proctor.videoEl = cam; }
    paint(); wire(); gate(); clocks(); pstatus();
    const m = document.getElementById('ml'); m.scrollTop = m.scrollHeight;
  }
  function paint() {
    const mc = myColor(), n = g.moves.length, at = view ?? n;
    const fen = at === 0 ? START_FEN : at === n ? chess.fen() : g.moves[at - 1].fen, last = at ? g.moves[at - 1]?.uci : null;
    board.set({ fen, orientation: mc || 'w', lastMove: last, movable: live() && view === null && mc && (!g.proctoring || g.ready[mc]) && !sending ? mc : null });
    document.querySelectorAll('#ml .mv').forEach(e => e.classList.toggle('cur', +e.dataset.ply === at));
  }
  async function onMove(mv) {
    if (sending) return; let m;
    try { m = chess.move({ from: mv.from, to: mv.to, promotion: mv.promotion || 'q' }); } catch { return paint(); }
    const end = chess.isCheckmate() ? 'checkmate' : chess.isStalemate() ? 'stalemate' : chess.isInsufficientMaterial() ? 'insufficient material' : chess.isThreefoldRepetition() ? 'threefold repetition' : chess.isDraw() ? 'fifty-move rule' : null;
    const uci = m.from + m.to + (m.promotion || ''), fen = chess.fen();
    // show the move at once, then confirm with the server
    g.moves.push({ san: m.san, uci, fen, clk: 0 }); g.ply++; g.fen = fen; g.clock[g.turn] = remaining(g.turn); g.turn = g.turn === 'w' ? 'b' : 'w'; clockAt = Date.now();
    sending = true; render();
    try { const ng = await rpc('ca_move', { p_game: id, p_ply: g.ply, p_san: m.san, p_uci: uci, p_fen: fen, p_end: end }); sending = false; setGame(ng); chan.send({}); }
    catch (err) { sending = false; toast(err.message); try { setGame(await rpc('ca_game', { p_id: id })); } catch {} }
    if (!gone) render();
  }
  async function action(a) { try { const ng = await rpc('ca_action', { p_game: id, p_action: a }); setGame(ng); chan.send({}); render(); } catch (e) { toast(e.message); } }
  function wire() {
    const mc = myColor(), acts = document.getElementById('acts');
    if (acts) {
      acts.innerHTML = g.drawOffer && g.drawOffer !== mc ? `<b>Your opponent offers a draw.</b><button class="btn sm" data-g="accept">Accept</button><button class="btn ghost sm" data-g="decline">Decline</button>`
        : `<button class="btn ghost sm" data-g="offer" ${g.drawOffer === mc ? 'disabled' : ''}>${g.drawOffer === mc ? 'Draw offered' : 'Offer draw'}</button><button class="btn ghost sm" data-g="resign">Resign</button>`;
      acts.querySelectorAll('[data-g]').forEach(b => (b.onclick = async () => { const a = b.dataset.g;
        if (a === 'resign' && !(await confirmBox('Resign this game?', 'Your opponent will be awarded the win.', 'Resign', true))) return; action(a); }));
    }
    document.querySelectorAll('[data-nav]').forEach(b => (b.onclick = () => { const n = g.moves.length, cur = view ?? n, a = b.dataset.nav;
      view = a === '0' ? 0 : a === 'end' ? n : Math.max(0, Math.min(n, cur + +a)); paint(); }));
    document.querySelectorAll('#ml .mv').forEach(e => (e.onclick = () => { if (!live() && e.textContent) { view = +e.dataset.ply; paint(); } }));
    const rf = document.getElementById('reprf'); if (rf) rf.onclick = () => loadReport();
    const rc = document.getElementById('repchk'); if (rc) rc.onclick = async () => { rc.disabled = true; rc.textContent = 'Checking…';
      try { const r = await Check.run(null, id); if (r === null) toast('Another check is running. Try again in a moment.'); else toast(r.engine ? 'Engine check finished.' : 'The engine could not be loaded; monitoring evidence only.'); } catch (e) { toast(e.message); }
      await loadReport(); if (!gone) render(); };
    document.querySelectorAll('[data-res]').forEach(b => (b.onclick = async () => { if (!(await confirmBox(`Set the result to ${half(b.dataset.res)}?`, 'This overrides the recorded result.', 'Set result'))) return;
      try { await rpc('ca_set_result', { p_game: id, p_result: b.dataset.res }); setGame(await rpc('ca_game', { p_id: id })); render(); } catch (e) { toast(e.message); } }));
  }
  // Arbiter only: engine numbers, monitoring log and webcam snapshots of both players, during and after the game.
  async function loadReport() {
    if (S.user.role !== 'arbiter' || gone) return; repAt = Date.now();
    try { const r = await rpc('ca_report', { p_game: id }); repHtml = r.players.map(p => reportHtml(p, r.game.analysed)).join(''); } catch (e) { repHtml = `<p class="muted small">${esc(e.message)}</p>`; }
    const el = document.getElementById('rep'); if (el && !el.querySelector('details[open] img:hover')) el.innerHTML = repHtml;
  }
  function gate() {
    const el = document.getElementById('gate'), mc = myColor(); if (!el) return;
    if (!live() || !mc || !g.proctoring || proctor) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="gate"><div><h2>Fair play check</h2>
      <ul><li>Your camera and microphone must stay on for the whole game.</li><li>Stay on this page. Do not open other tabs or apps.</li><li>You must be alone and clearly visible.</li><li>Webcam snapshots are kept for the arbiters.</li></ul>
      <button class="btn" id="go">Turn on camera and microphone</button><p class="err" id="ge" style="color:#ffb4ab"></p><p class="small" style="opacity:.8">Your clock runs once the round starts, even before you are ready.</p></div></div>`;
    document.getElementById('go').onclick = startProctor;
  }
  async function startProctor() {
    const p = new Proctor({ gameId: id, videoEl: document.getElementById('cam'), onStatus: s => { pstat = s; pstatus();
      if (live() && proctor === p && (!s.camera || !s.mic)) { proctor = null; p.stop(); action('unready'); } } });
    try { await p.start(); proctor = p; await action('ready'); }
    catch (err) { p.stop(); const ge = document.getElementById('ge'); if (ge) ge.textContent = err.name === 'NotAllowedError' ? 'Permission was blocked. Allow camera and microphone for this site in your browser settings, then try again.'
      : err.name === 'NotFoundError' ? 'No camera or microphone was found on this device.' : (err.message || 'Could not start the camera.'); }
  }
  function pstatus() { const el = document.getElementById('pstat'); if (!el || !pstat) return; const d = (ok, t) => `<div><span class="dot ${ok ? 'ok' : 'bad'}"></span>${t}</div>`;
    el.innerHTML = d(pstat.camera, 'Camera') + d(pstat.mic, 'Microphone') + (pstat.ai === 'on' ? d(pstat.face === 'ok', pstat.face === 'many' ? 'More than one face' : pstat.face === 'none' ? 'Face not visible' : 'Face visible')
      : `<div><span class="dot"></span>${pstat.ai === 'loading' ? 'Starting face check…' : 'Face check unavailable (snapshots still sent)'}</div>`); }
  function clocks() {
    for (const c of ['w', 'b']) { const el = document.querySelector(`[data-clock="${c}"]`); if (!el) continue; const ms = remaining(c);
      el.textContent = fmtClock(ms); el.className = 'clock' + (live() && g.turn === c ? (ms < 20000 ? ' low' : ' run') : ''); }
    const st = document.getElementById('status');
    if (st && live()) { const wait = g.startsAt - offset - Date.now(), mc = myColor();
      st.innerHTML = wait > 0 ? `<b>Round starts in ${Math.ceil(wait / 1000)}s</b>` : mc ? (g.turn === mc ? '<b>Your move</b>' : 'Waiting for your opponent') : `${g.turn === 'w' ? 'White' : 'Black'} to move`; }
    // a clock reached zero: ask the server (its clock decides) to rule on it
    if (live() && !sending && remaining(g.turn) <= 0 && Date.now() - lastFlagTry > 1500) { lastFlagTry = Date.now(); rpc('ca_action', { p_game: id, p_action: 'timeout' }).then(ng => { if (!gone && setGame(ng)) { chan.send({}); render(); } }).catch(() => {}); }
  }
  app.innerHTML = shell('<p class="muted">Loading…</p>');
  S.cleanup = () => { gone = true; clearInterval(tick); clearTimeout(poll); chan.leave(); if (proctor) proctor.stop(); };
  try { setGame(await rpc('ca_game', { p_id: id })); } catch (err) { app.innerHTML = shell(`<div class="card"><p>${esc(err.message)}</p><a href="#/">Back to tournaments</a></div>`); return; }
  S.lastGame = id; render(); loadReport();
  tick = setInterval(clocks, 100);
  const loop = () => { poll = setTimeout(async () => { const was = live(); if (was) await refresh(); if (!gone && (Date.now() - repAt > 15000 && live() || was && !live())) loadReport(); if (!gone) loop(); }, S.rt ? 10000 : 2500); }; loop();
}

// ---------------- fair play reports (arbiter) ----------------
const EVN = { tab_hidden: 'Switched to another tab or app', window_blur: 'Clicked outside the game window', no_face: 'No face on camera', multiple_faces: 'More than one face on camera', camera_off: 'Camera off',
  mic_off: 'Microphone off', voice_detected: 'Talking detected', fullscreen_exit: 'Left full screen', ai_unavailable: 'Face check could not run on this device', proctor_started: 'Monitoring started', snapshot: '' };
const pct = x => (x == null ? '–' : Math.round(x * 100) + '%');
const okImg = s => (/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(s || '') ? s : '');

const eventsHtml = list => { const ev = list.filter(e => e.type !== 'snapshot');
  return ev.length ? `<table><tbody>${ev.map(e => `<tr><td class="num muted">${fmtTime(e.at)}</td><td class="name">${esc(EVN[e.type] || e.type)}${e.detail && e.type === 'ai_unavailable' ? ` <span class="muted small">${esc(e.detail)}</span>` : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted small">No monitoring events recorded.</p>'; };
// One player's part of a game report: engine numbers, monitoring log, webcam snapshots.
function reportHtml(p, analysed) {
  const a = p.analysis, inc = p.events.filter(e => !['snapshot', 'proctor_started', 'ai_unavailable'].includes(e.type)).length;
  return `<div class="rep"><div class="row spread"><div><b>${p.color === 'w' ? 'White' : 'Black'}: ${pname(p.user.name, p.user.title)}</b> <span class="muted small">${p.user.rating || ''} · ${esc(p.user.phone || '')}</span>${p.entryStatus === 'disqualified' ? ' <span class="pill bad">Disqualified</span>' : ''}</div>
      <div class="row" style="gap:.4rem">${p.case ? `<a class="btn sm ${p.case.status === 'open' ? 'danger' : 'ghost'}" href="#/case/${p.case.id}">Case ${p.case.score}/100 · ${esc(p.case.status)}</a>` : `<span class="pill">${a ? 'Score ' + a.score + '/100' : 'No case'}</span>`}</div></div>
    <div class="stats" style="margin:.6rem 0">${a ? `<div class="stat"><b>${pct(a.top1)}</b>engine first choice</div><div class="stat"><b>${pct(a.top3)}</b>engine top three</div><div class="stat"><b>${a.acpl == null ? '–' : a.acpl.toFixed(1)}</b>avg centipawn loss</div><div class="stat"><b>${a.counted ?? '–'}</b>moves assessed</div>`
      : `<div class="stat"><b>–</b>${analysed ? 'game too short for engine numbers' : 'engine check not run yet'}</div>`}<div class="stat"><b>${inc}</b>monitoring incident${inc === 1 ? '' : 's'}</div><div class="stat"><b>${p.snapshots.length}</b>webcam snapshots</div></div>

}

// Engine check queue. Runs in the arbiter's browser, by button or automatically in the background.
const Check = { running: false, engine: null, last: 0,
  async run(onProg, gameId) {
    if (this.running) return null; this.running = true; let done = 0, flagged = 0;
    try {
      if (!this.engine) { onProg && onProg('Loading the engine…'); try { const e = new Engine(); await e.init(); this.engine = e; } catch { this.engine = null; } }
      for (;;) {
        const q = await rpc('ca_analysis_queue', gameId ? { p_limit: 1, p_game: gameId } : { p_limit: 5 }); if (!q.length) break;
        for (const game of q) { onProg && onProg(`Checking game ${done + 1}… (${flagged} flagged so far)`);
          const rows = await analyseGame(game, this.engine);
          flagged += (await rpc('ca_save_analysis', { p_game: game.id, p_rows: rows, p_threshold: CONFIG.FAIRPLAY_THRESHOLD })).cases; done++; }
        if (gameId) break;
      }
    } finally { this.running = false; }
    return { done, flagged, engine: !!this.engine };
  },
  auto() { return CONFIG.AUTO_ENGINE_CHECK && localStorage.getItem('ca_autocheck') !== '0'; },
  async background() {       // called from the heartbeat while an arbiter has the site open
    if (!this.auto() || this.running || Date.now() - this.last < 30000) return; this.last = Date.now();
    try { const r = await this.run(); if (r && r.flagged) toast(`Engine check: ${r.flagged} new fair play case${r.flagged === 1 ? '' : 's'}. See the Arbiter desk.`); } catch {}
  } };

// ---------------- background check: new round started? any notice for me? ----------------
async function heartbeat() {
  if (!S.token || !S.user) return;
  try {
    const me = await rpc('ca_me'); S.user = me.user;
    const dq = me.notices.find(n => n.kind === 'disqualified'), info = me.notices.filter(n => n.kind !== 'disqualified');
    if (info.length) toast(info[info.length - 1].message);
    if (me.notices.length && document.getElementById('modal').hidden) {
      if (dq) await modal(`<h2 style="color:var(--danger)">You have been disqualified</h2><p>${esc(dq.message)}</p><div class="right"><button class="btn" data-close="ok">I understand</button></div>`, true);
      rpc('ca_notices_read').catch(() => {});
    }
    if (S.user.role === 'arbiter') Check.background();
    if (me.gameId && me.gameId !== S.lastGame) { S.lastGame = me.gameId; toast('Your round is starting. Opening your board…'); location.hash = '#/g/' + me.gameId; }
  } catch {}
}

// ---------------- router ----------------
async function route() {
  if (S.cleanup) { S.cleanup(); S.cleanup = null; }
  const h = location.hash || '#/';
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY) return viewSetup();
  if (!S.token) return h === '#/login' ? viewLogin() : viewLanding();
  if (!S.user) { try { S.user = (await rpc('ca_me')).user; } catch (e) { if (S.token) app.innerHTML = `<p style="padding:2rem">${esc(e.message)} <a href="">Retry</a></p>`; return; } }
  if (!S.user.profileComplete && h !== '#/profile') { location.hash = '#/profile'; return; }
  let m;
  try {
    if (h === '#/login') location.hash = '#/';
    else if (h === '#/profile') viewProfile();
    else if ((m = h.match(/^#\/t\/(\d+)/))) await viewTournament(+m[1]);
    else if ((m = h.match(/^#\/g\/(\d+)/))) await viewGame(+m[1]);
    else if (h === '#/arbiter' && S.user.role === 'arbiter') await viewArbiter();
    else if ((m = h.match(/^#\/case\/(\d+)/)) && S.user.role === 'arbiter') await viewCase(+m[1]);
    else await viewHome();
  } catch (err) { if (S.token && S.user) app.innerHTML = shell(`<div class="card"><p>${esc(err.message)}</p><a href="#/">Back to tournaments</a></div>`); }
}
const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFs() {
  const el = document.documentElement;
  try { if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = el.requestFullscreen || el.webkitRequestFullscreen; if (r) r.call(el); else toast('Full screen is not available in this browser. On iPhone, add this page to your Home Screen to hide the browser bars.'); } } catch {}
}
function fsLabel() { document.querySelectorAll('[data-act="fs"]').forEach(e => { e.textContent = fsOn() ? 'Exit full screen' : 'Full screen'; }); }
document.addEventListener('fullscreenchange', fsLabel); setInterval(fsLabel, 1000);
document.addEventListener('click', e => { const a = e.target.dataset && e.target.dataset.act;
  if (a === 'logout') { e.preventDefault(); logout(); } else if (a === 'fs') { e.preventDefault(); toggleFs(); } });
window.addEventListener('hashchange', route);
(async () => {
  document.title = CONFIG.APP_NAME;
  try { ({ Chess } = await import(CDN + 'chess.js@1.4.0/+esm')); }
  catch { app.innerHTML = '<p style="padding:2rem;font-family:system-ui">Could not load the chess rules library. Check your internet connection and reload.</p>'; return; }
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY) await Promise.race([initRealtime(), new Promise(r => setTimeout(r, 4000))]);
  await route(); heartbeat();
  (function hb() { setTimeout(async () => { await heartbeat(); hb(); }, S.rt ? 20000 : 6000); })();
})();
</script>
</body>
